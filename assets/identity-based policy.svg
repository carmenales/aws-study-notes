<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- Círculo Identity-Based Policy -->
  <circle cx="230" cy="170" r="140" fill="#4a90d9" fill-opacity="0.35" stroke="#2c5f8a" stroke-width="2"/>
  <!-- Círculo Permissions Boundary -->
  <circle cx="370" cy="170" r="140" fill="#e07b39" fill-opacity="0.35" stroke="#a85423" stroke-width="2"/>

  <!-- Títulos -->
  <text x="180" y="60" font-size="12" font-weight="bold" fill="#2c5f8a">Identity-Based</text>
  <text x="200" y="75" font-size="12" font-weight="bold" fill="#2c5f8a">Policy</text>
  <text x="400" y="60" font-size="12" font-weight="bold" fill="#a85423" text-anchor="end">Permissions</text>
  <text x="400" y="75" font-size="12" font-weight="bold" fill="#a85423" text-anchor="end">Boundary</text>


  <!-- Permisos exclusivos de IBP -->
  <text x="150" y="145" font-size="12" fill="#1a1a1a">S3:*</text>
  <text x="150" y="165" font-size="12" fill="#1a1a1a">DynamoDB:*</text>
  <text x="150" y="185" font-size="12" fill="#1a1a1a">EC2:*</text>

  <!-- Permisos exclusivos de PB -->
  <text x="390" y="160" font-size="12" fill="#1a1a1a">CloudWatch:*</text>
  <text x="390" y="180" font-size="12" fill="#1a1a1a">IAM:*</text>

  <!-- Intersección: Permisos efectivos -->
  <text x="270" y="110" font-size="12" font-weight="bold" fill="#0a5c1f">Permisos</text>
  <text x="270" y="125" font-size="12" font-weight="bold" fill="#0a5c1f">Efectivos</text>

  <text x="280" y="170" font-size="12" fill="#0a5c1f">S3:*</text>
  <text x="280" y="190" font-size="12" fill="#0a5c1f">SQS:*</text>

  <!-- Etiqueta inferior -->
  <text x="300" y="330" font-size="12" fill="#555" text-anchor="middle">Permisos Efectivos = Identity-Based Policy ∩ Permissions Boundary</text>
</svg>